{% extends "base.html" %}
{% block title %}送信完了 | キミマッチ{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh; text-align: center; padding: 20px;">
    <div style="background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 400px;">
        <div style="font-size: 3rem; color: #198754; margin-bottom: 20px;">✓</div>
        <h2 style="font-weight: bold; margin-bottom: 15px;">送信完了</h2>
        <p style="color: #666; line-height: 1.6; margin-bottom: 30px;">
            お問い合わせを承りました。<br>内容を確認後、担当者よりご連絡いたします。
        </p>
        <a href="{% url 'accounts:dashboard' %}" 
           style="display: inline-block; padding: 12px 30px; background: #198754; color: white; text-decoration: none; border-radius: 30px; font-weight: bold;">
            ダッシュボードへ戻る
        </a>
    </div>
</div>
{% endblock %}
