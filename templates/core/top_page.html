{% extends "base.html" %}
{% load static %}

{% block title %}トップページ | キミマッチ{% endblock %}

{% block content %}

<div class="top-page-wrapper">
    <div class="container">
        
        <h2 style="text-align: center; color: #e62e2e; border-bottom: none; font-size: 2.2em; font-weight: bold; margin-bottom: 0;">
            キミマッチ へようこそ
        </h2>
        <p style="text-align: center; margin-bottom: 30px; font-size: 1.1em;">
            専門学校生と企業をつなぐ、ポートフォリオ型マッチングプラットフォーム
        </p>

        <div class="auth-box">
            <p>
                すでにアカウントをお持ちの方はこちら<br>
                <a href="{% url 'accounts:login' %}" class="btn btn-secondary">ログイン</a>
            </p>
            <hr style="margin: 20px 0; border-top: 1px solid #ffd1d1;">
            <p>
                初めてご利用の方（学生・教員・企業）はこちら<br>
                <a href="{% url 'accounts:signup_type_select' %}" class="btn btn-primary">新規登録</a>
            </p>
        </div>

        <hr>
        
        <h3 style="text-align: center; color: #333; font-size: 1.5em; border-bottom: none;">機能紹介・申し込み</h3>
        <div class="service-links">
            
            <a href="{% url 'core:student_service' %}">
                <span>🎓</span>
                学生向けの機能
            </a>

            <a href="{% url 'core:company_service' %}">
                <span>🏢</span>
                企業向けの機能　　　　申し込み
            </a>

            <a href="{% url 'core:school_service' %}"> 
                <span>👨‍🏫</span>
                学校向けの機能　　　　申し込み
            </a>

        </div>

    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // ★ 1. body にトップページ専用クラスを追加 (これでヘッダー/フッターが赤くなります)
        document.body.classList.add('top-page-mode');

        // 2. main-container の余白リセット (背景画像用)
        const mainContainer = document.querySelector('.main-container');
        if (mainContainer) {
            mainContainer.style.padding = '0';
            mainContainer.style.maxWidth = 'none';
            mainContainer.style.backgroundColor = 'transparent';
        }
        
        // 3. main タグの余白リセット
        const mainTag = document.querySelector('main');
        if (mainTag) {
            mainTag.style.padding = '0';
        }
    });
</script>

{% endblock %}
